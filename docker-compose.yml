services:
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      - SERVICES=sns,sqs
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics | grep -q order-created"]
      interval: 5s
      retries: 20

  order-service:
    build: ./order-service
    ports: ["8081:8080"]
    environment: &aws
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test        # fake keys, LocalStack only
      AWS_SECRET_ACCESS_KEY: test
      ORDERS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-created
    depends_on:
      localstack: { condition: service_healthy }

  notification-service:
    build: ./notification-service
    ports: ["8082:8080"]
    environment:
      <<: *aws
      ORDERS_QUEUE_URL: http://localstack:4566/000000000000/order-events
    depends_on:
      localstack: { condition: service_healthy }
