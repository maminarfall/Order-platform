apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: pods using this ServiceAccount get this IAM role (no AWS keys needed)
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
